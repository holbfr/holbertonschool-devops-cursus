# =============================================================================
# nginx/nginx.conf — SKELETON. This file is deliberately incomplete.
#
# It is mounted over /etc/nginx/nginx.conf in the load-balancer container, so it
# is a full nginx configuration (worker/events/http), not a conf.d fragment.
#
# Everything that is *not* the learning objective is already here: worker and
# event tuning, logging to stdout/stderr so `docker compose logs` works, the
# server block listening on port 80, and the standard proxy forwarding headers.
#
# What is missing are the two directives the lab is actually about, marked
# "TODO" below:
#
#   1. an `upstream` block declaring the pool of application replicas
#   2. a `proxy_pass` inside `location /` pointing at that pool
#
# As shipped, nginx starts but answers 404 for everything: there is no
# proxy_pass, so nothing is forwarded anywhere. That is expected until you
# complete both TODOs.
# =============================================================================

user  nginx;
worker_processes  auto;

error_log  /dev/stderr warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'upstream=$upstream_addr';

    access_log  /dev/stdout  main;

    sendfile           on;
    keepalive_timeout  65;

    # -------------------------------------------------------------------------
    # TODO 1 — declare the pool of application replicas.
    #
    # Open an `upstream` block, give it a name (the same name you will use in
    # `proxy_pass` below), and put one `server` line per application instance
    # inside it. Each line names a Compose service and the port the application
    # listens on *inside* the network — Docker's embedded DNS resolves service
    # names for you, so no IP addresses anywhere.
    #
    # Deliberately no balancing directive: with none, nginx uses its default
    # algorithm, which is what Task 3 asks you to prove with a hit tally.
    #
    #     upstream <pool-name> {
    #         server <service>:<port>;
    #         ...
    #     }
    # -------------------------------------------------------------------------

    server {
        listen       80;
        server_name  localhost;

        # ---------------------------------------------------------------------
        # TODO 2 — forward every request to the pool you declared above.
        #
        # Add the one directive that hands a matched request to an upstream
        # group, referencing it by name:
        #
        #     proxy_pass http://<pool-name>;
        #
        # Keep the headers below. They are the worked example: without them the
        # application only ever sees the proxy's own address, so client IPs and
        # the original scheme are lost. This is the standard forwarding idiom
        # and you should reproduce it in every reverse proxy you write.
        # ---------------------------------------------------------------------
        location / {
            # TODO 2: add your proxy_pass directive here.

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
            client_max_body_size  1m;
        }
    }
}
